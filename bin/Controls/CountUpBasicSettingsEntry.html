<form name="quiqqer-presentation-bricks-count-up-basic-settings-entry"
      class="quiqqer-presentation-bricks-count-up-basic-settings-entry-form"
>
    <table class="data-table data-table-flexbox">
        <tbody>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{fieldDisabled}}
                    </span>
                    <span class="field-container-field" id="disabledWrapper"></span>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{fieldCounterValuePrefix}}
                    </span>
                    <input name="counterValuePrefix" class="field-container-field" value=""/>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{fieldCounterValue}}
                    </span>
                    <input name="counterValue" class="field-container-field" value=""/>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{fieldCounterValueSuffix}}
                    </span>
                    <input name="counterValueSuffix" class="field-container-field" value=""/>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{fieldIcon}}
                    </span>
                    <input name="icon" class="field-container-field" value=""/>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{fieldTitle}}
                    </span>
                    <input name="title" class="field-container-field" value=""/>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <label class="field-container">
                    <span class="field-container-item">
                        {{fieldContent}}
                    </span>
                    <textarea name="content" rows="10" class="field-container-field"></textarea>
                </label>
            </td>
        </tr>
        </tbody>
    </table>
</form>
